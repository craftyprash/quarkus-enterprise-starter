# Local observability + quality demo stack — NOT for production, and separate from the app's own
# docker-compose.yml (which only runs the app's Postgres).
#
#   docker compose -f local-infra/compose.yml up -d                     # core: Grafana/Loki/Tempo/Prometheus
#   docker compose -f local-infra/compose.yml --profile errors up -d    # + GlitchTip (error tracking)
#   docker compose -f local-infra/compose.yml --profile sonar  up -d    # + SonarQube (code quality)
#
# See local-infra/INFRA.md for how to point the app at this and view each signal.

services:
  # Grafana + Loki (logs) + Tempo (traces) + Prometheus (metrics) + an OTel Collector, in one image.
  # Receives OTLP on 4317 (gRPC) / 4318 (HTTP). Grafana UI on http://localhost:3000 (anonymous).
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000" # Grafana
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - lgtm:/data

  # ---- errors: GlitchTip (self-hosted, Sentry-compatible) -------------------------------------
  glitchtip-postgres:
    image: postgres:16-alpine
    profiles: ["errors"]
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - glitchtip-pg:/var/lib/postgresql/data

  glitchtip-redis:
    image: redis:7-alpine
    profiles: ["errors"]

  glitchtip-web:
    image: glitchtip/glitchtip:latest
    profiles: ["errors"]
    depends_on: [glitchtip-postgres, glitchtip-redis]
    ports:
      - "8000:8080"
    environment: &glitchtip-env
      DATABASE_URL: postgres://postgres:postgres@glitchtip-postgres:5432/glitchtip
      REDIS_URL: redis://glitchtip-redis:6379/0
      SECRET_KEY: local-demo-not-a-real-secret-change-me
      PORT: "8080"
      GLITCHTIP_DOMAIN: http://localhost:8000
      DEFAULT_FROM_EMAIL: demo@localhost
      CELERY_WORKER_AUTOSCALE: "1,3"

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    profiles: ["errors"]
    depends_on: [glitchtip-postgres, glitchtip-redis]
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip-env

  glitchtip-migrate:
    image: glitchtip/glitchtip:latest
    profiles: ["errors"]
    depends_on: [glitchtip-postgres]
    command: ./manage.py migrate
    environment: *glitchtip-env

  # ---- sonar: SonarQube (code quality dashboard) ---------------------------------------------
  sonar-postgres:
    image: postgres:16-alpine
    profiles: ["sonar"]
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar-pg:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    profiles: ["sonar"]
    depends_on: [sonar-postgres]
    ports:
      - "9000:9000" # http://localhost:9000 (admin/admin)
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    # SonarQube runs Elasticsearch — the host needs: sysctl -w vm.max_map_count=262144

volumes:
  lgtm:
  glitchtip-pg:
  sonar-pg:
