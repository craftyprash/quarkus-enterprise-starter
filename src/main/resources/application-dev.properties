# Dev profile — points at the local Postgres from docker-compose.yml (`docker compose up -d`).
# Credentials come from .env (QUARKUS_DATASOURCE_USERNAME / QUARKUS_DATASOURCE_PASSWORD).
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/starter
quarkus.hibernate-orm.log.sql=true

# Flyway applies migrations (src/main/resources/db/migration) on startup.
quarkus.flyway.migrate-at-start=true

# OTel off in dev (no local collector). To demo it, start the local-infra stack and run with the
# env var QUARKUS_OTEL_SDK_DISABLED=false (see local-infra/INFRA.md).
quarkus.otel.sdk.disabled=true
