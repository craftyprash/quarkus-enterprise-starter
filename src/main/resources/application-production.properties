# Production profile (activated by QUARKUS_PROFILE=production).
# DB URL + credentials come from the environment (Kamal env.clear / env.secret) — never here.
quarkus.hibernate-orm.log.sql=false
quarkus.log.level=INFO

# Flyway applies migrations on startup. Coordinate with DevOps: if migrations must run as a
# controlled release step instead, set this to false and use quarkus.flyway.validate-at-start=true.
quarkus.flyway.migrate-at-start=true

# JSON logs (for aggregation) + error monitoring. Tracing is on by default (base); endpoints/DSN
# come from the environment.
quarkus.log.console.json.enabled=true
quarkus.log.sentry.dsn=${SENTRY_DSN:}
quarkus.log.sentry.level=ERROR
quarkus.log.sentry.in-app-packages=com.starter
