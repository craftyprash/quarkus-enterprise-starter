# Application
quarkus.application.name=quarkus-starter-enterprise

# Datasource — URL and credentials come from environment (.env locally, Kamal secrets in deploy)
quarkus.datasource.db-kind=postgresql

# Hibernate
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# OpenAPI / Swagger
quarkus.smallrye-openapi.info-title=Starter Enterprise API
quarkus.smallrye-openapi.info-version=${quarkus.application.version:0.1.0}
quarkus.swagger-ui.always-include=true

# Micrometer
quarkus.micrometer.export.prometheus.enabled=true

# Jackson
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.serialization-inclusion=non-null
quarkus.jackson.write-dates-as-timestamps=false
quarkus.jackson.timezone=UTC

# HTTP — bind all interfaces so the container is reachable behind the gateway
quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# Authentication/authorization are handled at the API gateway (APISix), not in this app.
