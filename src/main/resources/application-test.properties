# Test profile — H2 in-memory
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=

# Tests use H2 + Hibernate drop-and-create; Flyway stays off (migrations are exercised in dev/deploy).
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.flyway.migrate-at-start=false

# Scheduled processors are driven directly in tests, never by the clock (CLAUDE.md §13).
quarkus.scheduler.enabled=false
