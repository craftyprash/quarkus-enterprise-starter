# Test profile — a throwaway PostgreSQL via Quarkus Dev Services (Testcontainers).
# No jdbc.url is set, so Quarkus starts a container automatically (Docker required, incl. CI).
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=postgres:16-alpine

# Flyway owns the schema — the SAME migrations as dev/prod, so they're exercised here.
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true

# Scheduled processors are driven directly in tests, never by the clock (CLAUDE.md §13).
quarkus.scheduler.enabled=false
